name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary needs both slices.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: mdViewer ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
          releaseBody: |
            ## Install

            Download the `.dmg`, open it, and drag mdViewer to Applications.

            **This build is not signed or notarized.** macOS will refuse to open
            it on the first try. To get past Gatekeeper, right-click the app and
            choose *Open*, then confirm — or run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/mdViewer.app
            ```

            Signing requires a paid Apple Developer account, which this project
            does not have.
